dir: local
	path /var/lib/vz
	content vztmpl,iso,import,backup
	shared 0

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

zfspool: data-storage
	pool data-storage
	content rootdir,images
	mountpoint /data-storage
	nodes Serwer
	sparse 0

dir: HDD-Backups
	path /data-storage/backups
	content iso,backup
	nodes Serwer,MT2ThinkCentre
	prune-backups keep-all=1
	shared 1

